name: Publish docs PR preview

on:
  workflow_run:
    workflows: [Build docs PR preview]
    types: [completed]
  pull_request_target:
    branches: [gh-pages]
    types: [closed]

permissions:
  contents: read

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.pull_requests[0].base.ref == 'gh-pages' &&
      github.event.workflow_run.pull_requests[0].head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: docs-preview-${{ github.event.workflow_run.pull_requests[0].number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: read
    steps:
      - name: Confirm the build still matches an open PR head
        id: candidate
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const candidate = run.pull_requests?.find(pr =>
              pr.base.ref === 'gh-pages' &&
              pr.head.repo?.full_name === `${context.repo.owner}/${context.repo.repo}`
            );
            if (!candidate) {
              core.setOutput('publish', 'false');
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: candidate.number,
            });
            if (pr.state !== 'open' || pr.head.sha !== candidate.head.sha) {
              core.setOutput('publish', 'false');
              return;
            }

            core.setOutput('publish', 'true');
            core.setOutput('number', String(pr.number));
            core.setOutput('sha', pr.head.sha);

      - name: Check out the publishing branch
        if: steps.candidate.outputs.publish == 'true'
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
          fetch-depth: 0

      - name: Download the build artifact from this workflow run
        if: steps.candidate.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          name: docs-preview-site
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: preview-files

      - name: Validate and publish only this PR directory
        if: steps.candidate.outputs.publish == 'true'
        shell: bash
        env:
          PR_NUMBER: ${{ steps.candidate.outputs.number }}
          PREVIEW_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
          [[ "$PREVIEW_SHA" =~ ^[0-9a-f]{40}$ ]]
          test -f preview-files/index.html
          if find preview-files -type l -print -quit | grep -q .; then
            echo "Preview artifact contains a symlink; refusing to publish it."
            exit 1
          fi
          if find preview-files -name .git -print -quit | grep -q .; then
            echo "Preview artifact contains a .git path; refusing to publish it."
            exit 1
          fi

          target="gh-pages/previews/pr-${PR_NUMBER}"
          rm -rf -- "$target"
          mkdir -p "$target"
          cp -R preview-files/. "$target/"
          rm -f "$target/CNAME"
          printf '{"pull_request":%s,"head_sha":"%s"}\n' "$PR_NUMBER" "$PREVIEW_SHA" > "$target/preview-info.json"

          git -C gh-pages config user.name "github-actions[bot]"
          git -C gh-pages config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C gh-pages add -A -- "previews/pr-${PR_NUMBER}"
          if git -C gh-pages diff --cached --quiet; then
            exit 0
          fi
          git -C gh-pages commit -m "docs: publish preview for PR #${PR_NUMBER}"
          for attempt in {1..5}; do
            if git -C gh-pages push origin HEAD:gh-pages; then
              exit 0
            fi
            git -C gh-pages fetch origin gh-pages
            git -C gh-pages rebase origin/gh-pages
          done
          echo "Could not publish after five branch-update retries."
          exit 1

      - name: Wait until GitHub Pages serves this preview build
        if: steps.candidate.outputs.publish == 'true'
        shell: bash
        env:
          PR_NUMBER: ${{ steps.candidate.outputs.number }}
          PREVIEW_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          url="https://badocs.diroots.com/previews/pr-${PR_NUMBER}/preview-info.json?sha=${PREVIEW_SHA}"
          deadline=$((SECONDS + 600))
          while (( SECONDS < deadline )); do
            body="$(curl --fail --silent --show-error --max-time 15 "$url" 2>/dev/null || true)"
            if [[ "$body" == *"\"head_sha\":\"${PREVIEW_SHA}\""* ]]; then
              exit 0
            fi
            sleep 15
          done
          echo "GitHub Pages did not serve preview commit ${PREVIEW_SHA} within 10 minutes."
          exit 1

      - name: Add or update the preview comment
        if: steps.candidate.outputs.publish == 'true'
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.candidate.outputs.number }}
          PREVIEW_SHA: ${{ steps.candidate.outputs.sha }}
        with:
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            const marker = '<!-- distem-docs-preview -->';
            const url = `https://badocs.diroots.com/previews/pr-${prNumber}/`;
            const body = `Documentation preview: [open the PR preview](${url})\n\nBuilt from commit \`${process.env.PREVIEW_SHA}\`.\n\n${marker}`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });
            const existing = comments.find(comment => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }

  cleanup:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: docs-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: read
    steps:
      - name: Check out the publishing branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
          fetch-depth: 0

      - name: Remove the closed PR preview
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
          target="previews/pr-${PR_NUMBER}"
          if [[ -d "gh-pages/$target" ]]; then
            rm -rf -- "gh-pages/$target"
            git -C gh-pages config user.name "github-actions[bot]"
            git -C gh-pages config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C gh-pages add -A -- "$target"
            if ! git -C gh-pages diff --cached --quiet; then
              git -C gh-pages commit -m "docs: remove preview for PR #${PR_NUMBER}"
              pushed=false
              for attempt in {1..5}; do
                if git -C gh-pages push origin HEAD:gh-pages; then
                  pushed=true
                  break
                fi
                git -C gh-pages fetch origin gh-pages
                git -C gh-pages rebase origin/gh-pages
              done
              if [[ "$pushed" != true ]]; then
                echo "Could not publish cleanup after five branch-update retries."
                exit 1
              fi
            fi
          fi

      - name: Mark the preview comment as expired
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            const marker = '<!-- distem-docs-preview -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });
            const existing = comments.find(comment => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: `Preview removed because PR #${prNumber} is closed.\n\n${marker}`,
              });
            }

