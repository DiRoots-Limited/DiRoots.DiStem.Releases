name: Build docs PR preview

# The trusted master-branch publisher resolves this PR from the run's branch and head SHA.
on:
  pull_request:
    branches: [gh-pages]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: docs-preview-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the PR merge commit
        uses: actions/checkout@v4

      - name: Set up Ruby and install locked dependencies
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      - name: Build the preview with its public path prefix
        run: bundle exec jekyll build --destination _site --baseurl "/previews/pr-${{ github.event.pull_request.number }}"

      - name: Upload preview files for the trusted publisher
        uses: actions/upload-artifact@v4
        with:
          name: docs-preview-site
          path: _site/
          if-no-files-found: error
          retention-days: 1

